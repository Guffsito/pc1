spring.application.name=labreserve-api

# Base de datos en memoria para la evaluacion
spring.datasource.url=jdbc:h2:mem:labreserve;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Las fechas viajan como ISO-8601, no como timestamps numericos
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

labreserve.jwt.secret=${LABRESERVE_JWT_SECRET:bGFicmVzZXJ2ZS11dGVjLWRicC0yMDI2LTEtY2xhdmUtaG1hYy1zaGEyNTYtcGFyYS1maXJtYXItdG9rZW5z}
labreserve.jwt.expires-in=3600
